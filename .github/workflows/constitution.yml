name: Constitution — Charter Enforcement

# The charter forbids specific things. Several of those prohibitions are decidable by a
# script, and the ones that are get enforced here rather than trusted to review.
#
# What this workflow does NOT claim: it cannot decide whether a design honours the spirit of
# an Article. A determined contributor routes around any grep. Every check here is scoped to
# catching drift and accident — the honest failure mode — and is described that way in its own
# output, because a check that overstates its reach makes maintainers trust CI more than it
# deserves, which is worse than having no check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: constitution-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Article 4 and REGISTRY.md scope: "an implementation that adds a privileged writer, an
  # admin key or a seizure path is not a VayuWeb registry."
  no-privileged-writer:
    name: no privileged writer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Source must not implement a privileged writer
        # Scoped to source deliberately. The specifications and the Constitution discuss these
        # words in order to prohibit them; matching prose would fail on the very documents that
        # forbid the thing, which is how a check teaches people to ignore it.
        run: |
          if git grep -inE '\b(admin_?key|root_?key|master_?key|seizure|superuser|backdoor)\b' \
               -- 'registry/src/*.ts' 'proxy/**' 'client/**' ':!*README.md'; then
            echo "::error::privileged-writer vocabulary found in source"
            exit 1
          fi
          echo "OK — no privileged-writer vocabulary in source."
          echo "Scope note: accident and drift detection only. A determined author renames."

  # Licence integrity: CC0 for charter/specs/artwork, MIT for code, and no CLA — ever.
  licensing:
    name: licensing and no-CLA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Licence texts are present
        run: |
          test -f LICENSE || { echo "::error::LICENSE missing"; exit 1; }
          test -f LICENSES/CC0-1.0.txt || { echo "::error::CC0 text missing"; exit 1; }
          test -f LICENSES/MIT.txt || { echo "::error::MIT text missing"; exit 1; }
          echo "OK — both licence texts present."
      - name: No Contributor Licence Agreement is introduced
        # A CLA is how a project quietly acquires the power to relicense contributors' work,
        # so its introduction must be a deliberate, visible act.
        #
        # This checks for the ARTIFACTS a CLA brings, not for the phrase. An earlier version
        # grepped the corpus for "contributor licence agreement" and failed on LICENSE,
        # CHANGELOG.md, FAQ.md and VWIP-0002 — every one of them a document promising there
        # will never be one. A prose grep cannot tell a prohibition from an adoption, which
        # makes it undecidable; the presence of a signature bot or a signatures file is not.
        run: |
          set -euo pipefail

          artefacts=0
          for path in .github/cla.yml .github/cla.yaml .cla-signatures \
                      cla-signatures.json .github/CLA.md; do
            if [ -e "$path" ]; then
              echo "::error::CLA artefact present — $path"
              artefacts=1
            fi
          done

          # A CLA bot is wired in as a workflow step. Match the actions, not the words.
          if git grep -lniE 'cla-assistant|contributor-assistant/github-action|cla-bot' \
               -- '.github/workflows/*' ':!.github/workflows/constitution.yml' > /dev/null 2>&1; then
            echo "::error::a CLA bot action is configured in a workflow"
            artefacts=1
          fi

          [ "$artefacts" -eq 0 ] || exit 1

          # The positive half: the promise must still be in the two documents that make it.
          grep -qi 'no Contributor Licence Agreement' CONTRIBUTING.md || {
            echo "::error::CONTRIBUTING.md no longer states that there is no CLA"; exit 1; }
          grep -qi 'no Contributor Licence Agreement' LICENSE || {
            echo "::error::LICENSE no longer states that there is no CLA"; exit 1; }

          echo "OK — no CLA artefacts, and both LICENSE and CONTRIBUTING.md still say so."

  # Article citations across the corpus must resolve to an Article that exists. A citation
  # pointing at a renumbered or deleted Article is how a rule quietly stops applying.
  citations:
    name: article citations resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Every cited Article exists
        run: |
          python3 - <<'PY'
          import re, pathlib, sys

          charter = pathlib.Path('constitution/CONSTITUTION.md').read_text(encoding='utf-8')
          defined = set(int(n) for n in re.findall(r'^#+\s*Article\s+(\d+)', charter, re.M))
          if not defined:
              sys.exit("no Articles found in the charter — the parser or the file changed")

          cited, bad = 0, []
          for path in pathlib.Path('.').rglob('*.md'):
              if any(p in path.parts for p in ('node_modules', 'dist', '.git')):
                  continue
              for n in re.findall(r'Article\s+(\d+)', path.read_text(encoding='utf-8')):
                  cited += 1
                  if int(n) not in defined:
                      bad.append(f"{path}: Article {n}")

          print(f"{len(defined)} Articles defined, {cited} citations checked")
          if bad:
              for b in sorted(set(bad)):
                  print(f"::error::unresolvable citation — {b}")
              sys.exit(1)
          print("OK — every cited Article exists.")
          PY

  # The charter is supreme over the specifications and the code. That hierarchy decides nothing
  # unless the charter agrees with itself, and a corpus audit found it does not.
  self-consistency:
    name: charter agrees with itself
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Quantities stated in more than one place agree, or the conflict is on the record
        # This does not decide which value is right — that is an amendment under Article 9, not a
        # lint. It refuses to let a disagreement go unnoticed, and refuses to let one be closed
        # by editing one side, which would be an implementer deciding what Article 9 reserves.
        run: python3 scripts/check-charter-consistency.py

  # Article 35.1 incorporates the Namespace Annex by reference and Article 2.31 forbids fetching
  # the valid set at run time, so every implementation carries a copy — and a copy can drift. A
  # copy wrong by one entry accepts names other implementations reject, which is a namespace fork
  # presenting as an intermittent resolution failure rather than as an error.
  namespace-annex:
    name: the namespace annex and its compiled copy agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: The generated TLD set is exactly the Annex
        # Also validates the Annex itself on the way through: every entry against the TLD grammar
        # of NAMES.md, no duplicates, per-section counts summing to the stated total, and every
        # extension named in the text of Article 35.1 present. A count that disagrees with its own
        # enumeration is how the previous namespace defect went unnoticed.
        run: python3 scripts/generate-namespace.py --check

  constitution-pass:
    name: constitution-pass
    # One required status check instead of one per job. Branch protection points here, so
    # adding or renaming a job above does not mean editing repository settings — and a
    # skipped or cancelled dependency cannot pass for success.
    needs: [no-privileged-writer, licensing, citations, self-consistency, namespace-annex]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every constitution check succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "results: $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::a constitution check did not succeed"; exit 1; }
          done
          echo "OK — charter enforcement passed."
