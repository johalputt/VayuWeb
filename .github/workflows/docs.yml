name: docs

# The repository is documentation and specification only, so this is the whole gate:
# lint every markdown file and verify that every relative link resolves to a file that
# actually exists. A broken cross-reference in a specification is a real defect.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Lint markdown
        run: npx --yes markdownlint-cli2 "**/*.md" "!node_modules"

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check relative links resolve
        run: python3 scripts/check-links.py

  headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check security headers are quoted identically everywhere
        # The strict content-security profile is normative and is defined in
        # exactly one place. A quotation that drifts means two implementers read
        # two different policies and both believe they conform.
        run: python3 scripts/check-headers.py
