name: CI — Build, Test and Specification Integrity

# Every commit is gated here. The repository was documentation-only until the registry
# implementation started, so this replaces the former docs-only workflow: markdown and link
# integrity still matter, and now so does the code.
#
# Checks are grouped by what they NEED, not by what they assert: one job per distinct toolchain
# and network requirement. Splitting one check per job would buy nothing but a longer list of
# required-status-check names to maintain and more chances for a package index to red a typo fix.
# Source discipline lives in quality.yml, charter rules in constitution.yml, and threat-model
# rules in security.yml, for the same reason.
#
# Jobs that need no network do not get a language setup step: the runner already has python3,
# and every checker in scripts/ is standard library only. That is not a preference, it is the
# difference between a gate that fails when the code is wrong and one that also fails when a
# package index is having an afternoon.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. No job here writes to the repository, comments, or publishes anything.
permissions:
  contents: read

# A superseded run on the same ref is wasted work; cancel it. A run on `main` is never
# superseded, because its result is a record rather than a preview -- and the discriminator is in
# the GROUP rather than in `cancel-in-progress`.
#
# That is not a style choice. `cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}` is what
# this file said, and it did not work: run 31068869289 on `main` was cancelled one second after
# the next push started, having recorded no jobs at all. An expression in that field yields the
# STRING "false", which is non-empty and therefore truthy, so the guard was inert on every
# workflow here. Putting `github.sha` in the group for main gives each commit a group of its own,
# so nothing can supersede it, and leaves branch runs sharing a group per ref as intended.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The specification corpus: link integrity and header drift.
  # Standard library Python over a checkout. No network, no setup step.
  # ---------------------------------------------------------------------------
  conformance:
    name: conformance (specs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Assert the runner Python is new enough for the checkers
        run: |
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 9):
              raise SystemExit(f"need Python 3.9+, runner has {sys.version.split()[0]}")
          print(f"python {sys.version.split()[0]}")
          PY

      - name: Relative links resolve
        # A broken cross-reference in a specification is a real defect: it is how an
        # implementer ends up reading a rule that no longer exists.
        run: python3 scripts/check-links.py

      - name: Security header quotations have not drifted
        # The strict content-security profile is normative and defined in exactly one place.
        # A quotation that drifts means two implementers read two different policies and both
        # believe they conform.
        run: python3 scripts/check-headers.py

      - name: Counted claims agree with the source that defines them
        # "The eleven launch TLDs" is a fact about a list in another file, and nothing kept the
        # two in step. The list held `.vayu` twice, so the sentence said twelve; eight documents
        # inherited the wrong number, and correcting the two that were noticed left six still
        # wrong. A number derived from the source cannot drift from it.
        run: python3 scripts/check-counts.py

      - name: No document claims to be unimplemented while source implements it
        # ROADMAP.md opened with "Nothing here is implemented" long after that stopped being
        # true, CONTRIBUTING.md told contributors there was no implementation while sixteen
        # modules cited REGISTRY.md by name, and eight specifications carried "not yet
        # implemented" against code that implements them. Nobody wrote a false sentence; a true
        # one went stale. The evidence comes from the source rather than a hand-written map, so
        # adding the code is what fails the check.
        run: python3 scripts/check-status-claims.py

      - name: No document makes a claim Article 21.4 forbids
        # Article 21.4 is a MUST NOT -- "anonymous", "uncensorable", "cannot be taken down",
        # "100% private" and any unqualified absolute of the same kind -- and nothing checked it.
        # Seven violations were live when this was first run, including POSITION.md's own thesis
        # pull-quote and two sentences in the FAQ. Article 21.5 supplies the test and explains why
        # a careful author kept missing them: what the words assert to a reader who has read
        # nothing else, "not what a longer passage elsewhere qualifies". Every one sat within a
        # few paragraphs of an honest caveat the author had in mind and the reader does not.
        #
        # The self-test runs first, and it is not ceremony: this checker has twice been
        # changed in a way that narrowed its reach while its own docstring was edited to say
        # the opposite. Each case is a sentence it got wrong once -- a violation split across
        # a hard wrap, and one exempted by a "no" belonging to a different clause.
        run: |
          python3 scripts/check-absolute-claims.py --self-test
          python3 scripts/check-absolute-claims.py

      - name: The published site's generated files match what they were generated from
        # site/ carries the brand mark, the namespace and Article 21.4's forbidden
        # claims, none of them written by hand. A stale copy is invisible -- the page
        # still renders -- and the namespace one matters most: the Annex is normative,
        # so a drifted copy on the project's own front page is a second namespace
        # published with the project's authority.
        run: python3 scripts/check-site-generated.py

      - name: Every VWIP carries the sections VWIP-0000 makes mandatory
        # VWIP-0000 section 3 says "an editor checks their presence, never their merit" -- a
        # mechanical check described in prose and performed by nobody. VWIP-0000 is itself Final
        # and was missing five of its own mandatory sections, so the document defining the
        # completeness bar was the one document never measured against it.
        run: python3 scripts/check-vwips.py

      - name: No worked example contradicts the rule beside it
        # An example is the part of a specification that gets copied: nobody reimplements a
        # paragraph from memory, they paste the block and edit it. PUBLISHING.md's canonical
        # manifest declared `notFound` and `fallback` together, and section 2.3 three paragraphs
        # below serves `notFound` first -- so the field a publisher with client-side routing was
        # relying on could never be reached, and the example produced a 404 on every deep link,
        # which is the one failure that section exists to prevent.
        #
        # The self-test runs first for the same reason the absolute-claims one does: a checker
        # narrowed by an edit reports "clean" in exactly the voice of a checker that works.
        run: |
          python3 scripts/check-examples.py --self-test
          python3 scripts/check-examples.py

  # ---------------------------------------------------------------------------
  # The registry implementation. This is the gate the repository did not have.
  # ---------------------------------------------------------------------------
  registry:
    name: registry (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22.6 is the floor: the test script uses --experimental-strip-types, which does not
        # exist before it. 24 is the forward check, so a Node change that breaks the strict
        # decoder is found here rather than by a peer refusing our records.
        node: ["22", "24"]
    defaults:
      run:
        working-directory: registry
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: registry/package-lock.json

      - name: Install exactly what the lockfile says
        # `npm ci` rather than `npm install`: it fails on a lockfile that disagrees with
        # package.json instead of quietly rewriting it.
        run: npm ci

      - name: Typecheck
        # `node --test --experimental-strip-types` erases types without checking them, so the
        # strictness options in tsconfig.json are verified by this step and nothing else.
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Markdown lint. Kept separate because it is the only job that needs npm for the
  # documentation corpus, and a package-index flake here must not red the code gate.
  # ---------------------------------------------------------------------------
  markdown:
    name: markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Lint markdown
        # Version pinned rather than `npx --yes markdownlint-cli2`: the unpinned form resolves
        # whatever is newest at run time and executes it, which is an unreviewed dependency
        # with code execution inside CI.
        #
        # Globs come from .markdownlint-cli2.jsonc only. Passing them on the command line as
        # well does not override the config — markdownlint-cli2 takes the UNION of both, so a
        # command-line exclusion silently fails to exclude anything the config still matches.
        run: npx --yes markdownlint-cli2@0.18.1

  # ---------------------------------------------------------------------------
  # The conformance vectors are the interoperability contract. A committed artifact that no
  # longer matches what the code generates means every second implementation is being checked
  # against bytes this one no longer produces.
  # ---------------------------------------------------------------------------
  vectors:
    name: conformance vectors are current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: registry/package-lock.json

      - name: Regenerate and require no diff
        run: |
          set -euo pipefail
          npm --prefix registry ci
          npm --prefix registry run vectors
          if ! git diff --quiet -- conformance/vectors.json; then
            echo "::error::conformance/vectors.json is stale — run 'npm run vectors' and commit"
            git diff --stat -- conformance/vectors.json
            exit 1
          fi
          echo "OK — the committed vectors match a fresh generation."

  client:
    name: client (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build and test
        # No system GUI dependencies are installed here on purpose. This crate holds the parts
        # of the desktop client that touch a secret, and those must build and be testable
        # without a display -- a security rule that can only be checked by launching a window
        # is a security rule nobody checks in CI.
        #
        # Release profile because the proof-of-work tests evaluate real Argon2id at the
        # protocol's 64 MiB cost, and a debug build turns seconds of memory-hard work into
        # minutes. The tests are not skipped or weakened to fit a budget.
        run: cargo test --release --locked

      - name: Formatting and lints
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Regenerate the client-built fixtures and require no diff
        # The fixtures are records BUILT by this crate and verified by the registry job's
        # implementation; regeneration must be byte-identical or the builder is no longer a
        # pure function of its fixed inputs, which is how cross-language drift would announce
        # itself before it ever reached the network.
        run: |
          set -euo pipefail
          cargo run --release --locked --bin write-fixtures
          if ! git diff --quiet -- ../conformance/client-built.json; then
            echo "::error::conformance/client-built.json is stale — run 'cargo run --bin write-fixtures' and commit"
            git diff --stat -- ../conformance/client-built.json
            exit 1
          fi
          echo "OK — the committed fixtures match a fresh build."

  ci-pass:
    name: ci-pass
    # One required status check rather than one per job, so branch protection does not need
    # editing every time a job is added or a matrix leg changes. `if: always()` plus the
    # explicit success comparison means a skipped or cancelled dependency fails here; a bare
    # `needs:` would let a cancelled job pass for green.
    needs: [conformance, registry, client, markdown, vectors]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every CI check succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "results: $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::a CI check did not succeed"; exit 1; }
          done
          echo "OK — build, test and specification integrity passed."
