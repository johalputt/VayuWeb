name: CI — Build, Test and Specification Integrity

# Every commit is gated here. The repository was documentation-only until the registry
# implementation started, so this replaces the former docs-only workflow: markdown and link
# integrity still matter, and now so does the code.
#
# Checks are grouped by what they NEED, not by what they assert: one job per distinct toolchain
# and network requirement. Splitting one check per job would buy nothing but a longer list of
# required-status-check names to maintain and more chances for a package index to red a typo fix.
# Source discipline lives in quality.yml, charter rules in constitution.yml, and threat-model
# rules in security.yml, for the same reason.
#
# Jobs that need no network do not get a language setup step: the runner already has python3,
# and every checker in scripts/ is standard library only. That is not a preference, it is the
# difference between a gate that fails when the code is wrong and one that also fails when a
# package index is having an afternoon.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. No job here writes to the repository, comments, or publishes anything.
permissions:
  contents: read

# A superseded run on the same ref is wasted work; cancel it. Never cancel on main, where a
# run's result is a record rather than a preview.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------------------
  # The specification corpus: link integrity and header drift.
  # Standard library Python over a checkout. No network, no setup step.
  # ---------------------------------------------------------------------------
  conformance:
    name: conformance (specs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Assert the runner Python is new enough for the checkers
        run: |
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 9):
              raise SystemExit(f"need Python 3.9+, runner has {sys.version.split()[0]}")
          print(f"python {sys.version.split()[0]}")
          PY

      - name: Relative links resolve
        # A broken cross-reference in a specification is a real defect: it is how an
        # implementer ends up reading a rule that no longer exists.
        run: python3 scripts/check-links.py

      - name: Security header quotations have not drifted
        # The strict content-security profile is normative and defined in exactly one place.
        # A quotation that drifts means two implementers read two different policies and both
        # believe they conform.
        run: python3 scripts/check-headers.py

      - name: Counted claims agree with the source that defines them
        # "The eleven launch TLDs" is a fact about a list in another file, and nothing kept the
        # two in step. The list held `.vayu` twice, so the sentence said twelve; eight documents
        # inherited the wrong number, and correcting the two that were noticed left six still
        # wrong. A number derived from the source cannot drift from it.
        run: python3 scripts/check-counts.py

  # ---------------------------------------------------------------------------
  # The registry implementation. This is the gate the repository did not have.
  # ---------------------------------------------------------------------------
  registry:
    name: registry (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22.6 is the floor: the test script uses --experimental-strip-types, which does not
        # exist before it. 24 is the forward check, so a Node change that breaks the strict
        # decoder is found here rather than by a peer refusing our records.
        node: ["22", "24"]
    defaults:
      run:
        working-directory: registry
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: registry/package-lock.json

      - name: Install exactly what the lockfile says
        # `npm ci` rather than `npm install`: it fails on a lockfile that disagrees with
        # package.json instead of quietly rewriting it.
        run: npm ci

      - name: Typecheck
        # `node --test --experimental-strip-types` erases types without checking them, so the
        # strictness options in tsconfig.json are verified by this step and nothing else.
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Markdown lint. Kept separate because it is the only job that needs npm for the
  # documentation corpus, and a package-index flake here must not red the code gate.
  # ---------------------------------------------------------------------------
  markdown:
    name: markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Lint markdown
        # Version pinned rather than `npx --yes markdownlint-cli2`: the unpinned form resolves
        # whatever is newest at run time and executes it, which is an unreviewed dependency
        # with code execution inside CI.
        #
        # Globs come from .markdownlint-cli2.jsonc only. Passing them on the command line as
        # well does not override the config — markdownlint-cli2 takes the UNION of both, so a
        # command-line exclusion silently fails to exclude anything the config still matches.
        run: npx --yes markdownlint-cli2@0.18.1

  # ---------------------------------------------------------------------------
  # The conformance vectors are the interoperability contract. A committed artifact that no
  # longer matches what the code generates means every second implementation is being checked
  # against bytes this one no longer produces.
  # ---------------------------------------------------------------------------
  vectors:
    name: conformance vectors are current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: registry/package-lock.json

      - name: Regenerate and require no diff
        run: |
          set -euo pipefail
          npm --prefix registry ci
          npm --prefix registry run vectors
          if ! git diff --quiet -- conformance/vectors.json; then
            echo "::error::conformance/vectors.json is stale — run 'npm run vectors' and commit"
            git diff --stat -- conformance/vectors.json
            exit 1
          fi
          echo "OK — the committed vectors match a fresh generation."

  ci-pass:
    name: ci-pass
    # One required status check rather than one per job, so branch protection does not need
    # editing every time a job is added or a matrix leg changes. `if: always()` plus the
    # explicit success comparison means a skipped or cancelled dependency fails here; a bare
    # `needs:` would let a cancelled job pass for green.
    needs: [conformance, registry, markdown, vectors]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every CI check succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "results: $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::a CI check did not succeed"; exit 1; }
          done
          echo "OK — build, test and specification integrity passed."
