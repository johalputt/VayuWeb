[package]
name = "vayuweb-client"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "VayuWeb desktop client: identity, record construction and the control-API client"
publish = false

[dependencies]
zeroize = { version = "1", features = ["zeroize_derive"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# Record-build path hashes: BLAKE2b-256 for the record hash (suite 1) and SHA-256 for
# proof-of-work salt derivation. RustCrypto crates, no C toolchain involved.
blake2 = "0.10"
sha2 = "0.10"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }

[dev-dependencies]
serde_json = "1"

[lib]
name = "vayuweb_client"
path = "src/lib.rs"
